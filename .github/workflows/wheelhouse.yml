name: wheelhouse (herramienta de desarrollo)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Descargar ruedas para Python 3.13 / Linux
        run: |
          mkdir wh
          pip download -d wh --only-binary=:all: --python-version 3.13 --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 --platform manylinux_2_34_x86_64 --platform manylinux_2_39_x86_64 --platform any PySide6-Essentials av pyinstaller pyinstaller-hooks-contrib pytest
          ls -la wh
          tar czf wheelhouse.tgz wh
          split -b 1900m wheelhouse.tgz wheelhouse.tgz.part-
      - name: Publicar como prelanzamiento de desarrollo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev-wheelhouse -y -R "$GITHUB_REPOSITORY" --cleanup-tag || true
          gh release create dev-wheelhouse wheelhouse.tgz.part-* -R "$GITHUB_REPOSITORY" --prerelease --title "dev-wheelhouse (solo desarrollo)" --notes "Paquetes temporales para desarrollo. Se elimina antes del lanzamiento 1.0."

name: Pruebas y ejecutables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
          pip install -r requirements.txt pytest
      - name: Pruebas del motor
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q
      - name: Prueba de humo de la interfaz (capturas)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python scripts/capturas.py - capturas
      - uses: actions/upload-artifact@v4
        with: { name: capturas, path: capturas }

  ejecutable:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: Windows-x64 }
          - { os: macos-latest, nombre: macOS-AppleSilicon }
          - { os: ubuntu-22.04, nombre: Linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bibliotecas del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm packaging/turbulens.spec
      - name: Autoprueba del ejecutable
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/TurbuLENS.exe;
          elif [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/TurbuLENS.app/Contents/MacOS/TurbuLENS;
          else BIN=dist/TurbuLENS; fi
          "$BIN" --autoprueba
      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p paquete
          cp packaging/LEEME.txt paquete/ 2>/dev/null || true
          N="TurbuLENS-${GITHUB_REF_NAME//\//-}-${{ matrix.nombre }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/TurbuLENS.exe paquete/
            7z a "$N.zip" ./paquete/*
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp -R dist/TurbuLENS.app paquete/
            ditto -c -k --keepParent paquete "$N.zip"
          else
            cp dist/TurbuLENS paquete/ && chmod +x paquete/TurbuLENS
            tar czf "$N.tar.gz" -C paquete .
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: TurbuLENS-${{ matrix.nombre }}
          path: |
            TurbuLENS-*.zip
            TurbuLENS-*.tar.gz

  lanzamiento:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ejecutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artefactos, pattern: "TurbuLENS-*", merge-multiple: true }
      - name: Publicar lanzamiento
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev-wheelhouse -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          ls -la artefactos
          gh release create "$GITHUB_REF_NAME" artefactos/* -R "$GITHUB_REPOSITORY" \
            --title "TurbuLENS $GITHUB_REF_NAME" --notes-file packaging/NOTAS_VERSION.md

  # Mac con Intel: trabajo aparte para no bloquear el lanzamiento si no hay equipos Intel disponibles.
  mac-intel:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lanzamiento
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/turbulens.spec
      - name: Autoprueba
        env: { QT_QPA_PLATFORM: offscreen }
        run: dist/TurbuLENS.app/Contents/MacOS/TurbuLENS --autoprueba
      - name: Subir al lanzamiento
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir paquete && cp packaging/LEEME.txt paquete/ && cp -R dist/TurbuLENS.app paquete/
          N="TurbuLENS-${GITHUB_REF_NAME}-macOS-Intel.zip"
          ditto -c -k --keepParent paquete "$N"
          gh release upload "$GITHUB_REF_NAME" "$N" -R "$GITHUB_REPOSITORY" --clobber

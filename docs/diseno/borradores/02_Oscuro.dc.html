<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel científico oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F16}
a{color:#7FD3FF}a:hover{color:#B5E6FF}
</style>
</helmet>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; color: #E6EDF5; background: #0B0F16; min-height: 820px; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #1F2835; background: #0F141D">
    <strong style="font-size: 16px; font-weight: 600; letter-spacing: 0.02em">DIMM&nbsp;SEEING</strong>
    <span style="font-size: 12px; color: #93A1B3">Diego Fernando Cagua Lozada y Fredy Esteban Cruz Ospina</span>
    <div style="flex: 1"></div>
    <button type="button" style="font: inherit; font-size: 14px; min-height: 40px; padding: 8px 14px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px">Abrir video…</button>
    <button type="button" style="font: inherit; font-size: 14px; min-height: 40px; padding: 8px 14px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px">Exportar</button>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 8px 18px; background: {{accent}}; color: #061018; border: none; border-radius: 6px">▶ Procesar</button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <aside style="flex: 1 1 280px; max-width: 320px; min-width: 0; border-right: 1px solid #1F2835; padding: 18px; display: flex; flex-direction: column; gap: 18px; background: #0F141D">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 11px; letter-spacing: 0.12em; color: #93A1B3">EXTRACCIÓN</span>
        <label for="o-fmt" style="font-size: 13px; color: #B7C3D2">Formato de salida</label>
        <select id="o-fmt" style="font: inherit; font-size: 14px; min-height: 40px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px; padding: 0 10px"><option>PNG (sin pérdida)</option><option>TIFF 16 bits</option><option>JPG</option><option>NumPy .npy</option><option>FITS</option></select>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #B7C3D2">Desde (s)<input type="text" value="0" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 36px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px; padding: 0 8px"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #B7C3D2">Hasta (s)<input type="text" value="141,5" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 36px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px; padding: 0 8px"></label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #B7C3D2">Guardar 1 de cada N cuadros<input type="text" value="1" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 36px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px; padding: 0 8px"></label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 11px; letter-spacing: 0.12em; color: #93A1B3">TELESCOPIO</span>
        <sc-for list="{{params}}" as="p" hint-placeholder-count="4">
          <label style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: #B7C3D2">{{p.k}}<input type="text" value="{{p.v}}" style="width: 96px; font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 34px; background: #17202C; color: #E6EDF5; border: 1px solid #2A3646; border-radius: 6px; padding: 0 8px; text-align: right"></label>
        </sc-for>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px">
        <div style="flex: 2 1 380px; position: relative; background: #000000; border: 1px solid #1F2835; border-radius: 8px; height: 330px; overflow: hidden">
          <div style="position: absolute; left: 48%; top: 40%; width: 9px; height: 9px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 10px 3px rgba(127,211,255,0.5)"></div>
          <div style="position: absolute; left: 46.5%; top: 52%; width: 9px; height: 9px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 10px 3px rgba(127,211,255,0.5)"></div>
          <div style="position: absolute; left: 42%; top: 30%; width: 14%; height: 34%; border: 1px solid {{accent}}"></div>
          <span style="position: absolute; left: 12px; top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #93A1B3">VISTA PREVIA · cuadro 1820</span>
        </div>
        <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
            <div style="background: #111823; border: 1px solid #1F2835; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: #93A1B3">{{s.k}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #E6EDF5">{{s.v}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="background: #111823; border: 1px solid #1F2835; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px">
          <span style="font-size: 14px; font-weight: 500">Histograma de separación entre centroides</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #93A1B3">11,0 – 15,5 px · 8.484 cuadros</span>
        </div>
        <div role="img" aria-label="Histograma de separación, máximo cerca de 13,2 px" style="display: flex; align-items: flex-end; gap: 4px; height: 150px; border-bottom: 1px solid #2A3646">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="18">
            <div style="flex: 1; height: {{b.h}}; background: {{accent}}; border-radius: 2px 2px 0 0; opacity: 0.85"></div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #93A1B3">
        <span>Listo</span>
        <div style="flex: 1; height: 6px; background: #1F2835; border-radius: 3px"><div style="width: 100%; height: 6px; background: {{accent}}; border-radius: 3px"></div></div>
        <span>8.484 / 8.484</span>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4CC2FF","options":["#4CC2FF","#7EE787","#F0B95B"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4CC2FF';
    const hs = [3, 5, 11, 20, 32, 54, 75, 93, 97, 100, 79, 65, 42, 21, 11, 6, 2, 1];
    return {
      accent,
      bars: hs.map((h) => ({ h: Math.max(h, 1) + '%' })),
      params: [
        { k: 'Diámetro orificio (cm)', v: '2,5' },
        { k: 'Separación (cm)', v: '14' },
        { k: 'Longitud de onda (nm)', v: '550' },
        { k: 'Escala (″/px)', v: '[ESCALA]' }
      ],
      stats: [
        { k: 'Separación media', v: '13,16 px' },
        { k: 'Desviación σ', v: '0,72 px' },
        { k: 'Seeing', v: '[—] ″' },
        { k: 'Cuadros válidos', v: '8.484' }
      ]
    };
  }
}
</script>
</body>
</html>

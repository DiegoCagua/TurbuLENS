name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install PySide6 av pyinstaller && python -c "import PySide6, av; print(PySide6.__version__, av.__version__)"

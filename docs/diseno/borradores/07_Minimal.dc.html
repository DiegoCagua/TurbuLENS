<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minimalista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFBFA}
a{color:#3D3D3D}a:hover{color:#000000}
</style>
</helmet>
<div style="font-family: 'Outfit', system-ui, sans-serif; color: #141414; background: #FBFBFA; min-height: 820px; display: flex; flex-direction: column; align-items: center; padding: 48px 24px 28px; box-sizing: border-box">
  <div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: stretch; gap: 26px; flex: 1">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <h1 style="margin: 0; font-size: 40px; font-weight: 300; letter-spacing: -0.01em">DIMM Seeing</h1>
      <span style="font-size: 15px; color: #5C5C5C">Un video entra. Imágenes y seeing salen.</span>
    </div>

    <button type="button" style="font: inherit; min-height: 260px; border: 1.5px dashed #9A9A9A; border-radius: 24px; background: #FFFFFF; color: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9.5v5l4-2.5z"></path></svg>
      <span style="font-size: 20px; font-weight: 500">Suelta tu video aquí</span>
      <span style="font-size: 14px; color: #5C5C5C">o haz clic para elegirlo</span>
    </button>

    <div style="display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; font-size: 14px; color: #5C5C5C">
      <span>Formato: PNG</span><span>Recorte: automático</span><span>Destino: junto al video</span>
    </div>

    <button type="button" style="font: inherit; font-size: 17px; font-weight: 500; min-height: 56px; border: none; border-radius: 28px; background: {{accent}}; color: #FFFFFF">Separar y analizar</button>

    <details style="border-top: 1px solid #E2E2E0; padding-top: 14px">
      <summary style="cursor: pointer; font-size: 15px; color: #3D3D3D; min-height: 32px">Opciones avanzadas</summary>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 14px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5C5C5C">Formato<select style="font: inherit; font-size: 14px; min-height: 40px; border: 1px solid #D4D4D2; border-radius: 10px; padding: 0 8px; background: #FFFFFF; color: #141414"><option>PNG</option><option>TIFF 16 bits</option><option>JPG</option><option>NumPy</option><option>FITS</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5C5C5C">1 de cada N cuadros<input type="text" value="1" style="font: inherit; font-size: 14px; min-height: 40px; border: 1px solid #D4D4D2; border-radius: 10px; padding: 0 10px"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5C5C5C">Separación de orificios (cm)<input type="text" value="14" style="font: inherit; font-size: 14px; min-height: 40px; border: 1px solid #D4D4D2; border-radius: 10px; padding: 0 10px"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5C5C5C">Escala de placa (″/px)<input type="text" value="[—]" style="font: inherit; font-size: 14px; min-height: 40px; border: 1px solid #D4D4D2; border-radius: 10px; padding: 0 10px"></label>
      </div>
    </details>
  </div>
  <span style="font-size: 12px; color: #6B6B6B; margin-top: 20px">Diego Fernando Cagua Lozada</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#141414","options":["#141414","#1F5FBF","#0F7B6C"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#141414' };
  }
}
</script>
</body>
</html>

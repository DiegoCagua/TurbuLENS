name: Pruebas y ejecutables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
          pip install -r requirements.txt pytest
      - name: Pruebas del motor
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q
      - name: Prueba de humo de la interfaz (capturas)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python scripts/capturas.py - capturas
      - uses: actions/upload-artifact@v4
        with: { name: capturas, path: capturas }

  ejecutable:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: Windows-x64 }
          - { os: macos-latest, nombre: macOS-AppleSilicon }
          - { os: ubuntu-22.04, nombre: Linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bibliotecas del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Compilar con PyInstaller
        env: { TURBULENS_REQUIRE_XCB: "1" }
        run: pyinstaller --noconfirm packaging/turbulens.spec
      - name: Autoprueba del ejecutable
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/TurbuLENS.exe;
          elif [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/TurbuLENS.app/Contents/MacOS/TurbuLENS;
          else BIN=dist/TurbuLENS; fi
          "$BIN" --autoprueba
      - name: Prueba con ventana real (Windows y macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/TurbuLENS.exe; else BIN=dist/TurbuLENS.app/Contents/MacOS/TurbuLENS; fi
          "$BIN" --prueba-ventana
      - name: Prueba con ventana real en un Linux sin libxcb-cursor0 (como el de un usuario)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove -y libxcb-cursor0
          ! ldconfig -p | grep -q libxcb-cursor.so.0
          xvfb-run -a dist/TurbuLENS --prueba-ventana
      - name: Versión portátil (zip / tar.gz)
        shell: bash
        run: |
          mkdir -p paquete
          cp packaging/LEEME.txt paquete/
          cp LICENSE paquete/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md paquete/
          N="TurbuLENS-${GITHUB_REF_NAME//\//-}-${{ matrix.nombre }}"
          echo "N=$N" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh packaging/windows/firmar.ps1 dist/TurbuLENS.exe
            cp dist/TurbuLENS.exe paquete/
            7z a "$N.zip" ./paquete/*
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp dist/TurbuLENS paquete/ && chmod +x paquete/TurbuLENS
            cp packaging/linux/instalar.sh paquete/ && chmod +x paquete/instalar.sh
            cp turbulens/assets/turbulens_256.png paquete/turbulens.png
            tar czf "$N.tar.gz" -C paquete .
          fi
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Instalador de Windows (menú Inicio y escritorio)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          QT_QPA_PLATFORM: offscreen
        run: |
          # Versión en carpeta (abre más rápido que el .exe único) para el instalador
          TURBULENS_ONEFILE=0 pyinstaller --noconfirm --distpath dist_dir packaging/turbulens.spec
          dist_dir/TurbuLENS/TurbuLENS.exe --autoprueba
          pwsh packaging/windows/firmar.ps1 dist_dir/TurbuLENS/TurbuLENS.exe
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          V=$(python -c "import turbulens;print(turbulens.__version__)")
          "$ISCC" "//DMyVersion=$V" "//DSourceDir=$(cygpath -w "$PWD/dist_dir/TurbuLENS")" \
            "//DOutputName=$N-Instalador" packaging/windows/turbulens.iss
          mv instalador/*.exe .
          pwsh packaging/windows/firmar.ps1 "$N-Instalador.exe"
      - name: Firma y .dmg de macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/empaquetar.sh dist/TurbuLENS.app "$N.dmg"
      - run: ls -la
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: TurbuLENS-${{ matrix.nombre }}
          path: |
            TurbuLENS-*.zip
            TurbuLENS-*.tar.gz
            TurbuLENS-*.exe
            TurbuLENS-*.dmg

  lanzamiento:
    # Publica la versión de turbulens/__init__.py cuando llega a main y todo pasó (si aún no existe).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ejecutable
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      nueva: ${{ steps.v.outputs.nueva }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('turbulens/__init__.py').read()).group(1))")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "nueva=no" >> "$GITHUB_OUTPUT"; else echo "nueva=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.nueva == 'si'
        with: { path: artefactos, pattern: "TurbuLENS-*", merge-multiple: true }
      - name: Publicar lanzamiento
        if: steps.v.outputs.nueva == 'si'
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.v.outputs.tag }}" }
        run: |
          gh release delete dev-wheelhouse -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          cd artefactos
          for f in TurbuLENS-main-*; do mv "$f" "${f/TurbuLENS-main-/TurbuLENS-$TAG-}"; done
          ls -la
          gh release create "$TAG" * -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TurbuLENS $TAG" --notes-file ../packaging/NOTAS_VERSION.md

  # Mac con Intel: trabajo aparte para no bloquear el lanzamiento si no hay equipos Intel disponibles.
  mac-intel:
    needs: lanzamiento
    if: needs.lanzamiento.outputs.nueva == 'si'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/turbulens.spec
      - name: Autoprueba
        env: { QT_QPA_PLATFORM: offscreen }
        run: dist/TurbuLENS.app/Contents/MacOS/TurbuLENS --autoprueba
      - name: Prueba con ventana real
        run: dist/TurbuLENS.app/Contents/MacOS/TurbuLENS --prueba-ventana
      - name: Firma, .dmg y subida al lanzamiento
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.lanzamiento.outputs.tag }}"
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          N="TurbuLENS-$TAG-macOS-Intel.dmg"
          packaging/macos/empaquetar.sh dist/TurbuLENS.app "$N"
          gh release upload "$TAG" "$N" -R "$GITHUB_REPOSITORY" --clobber
